services:
  # PostgreSQL 15 — Primary data store
  postgres:
    container_name: callnow-postgres
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: voicelink
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 7 — Cache, queues, WebSocket state, rate limiting
  redis:
    container_name: callnow-redis
    image: redis:7-alpine
    ports:
      - '6383:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Go Echo Power Dialer Microservice
  dialer:
    container_name: callnow-dialer
    build:
      context: ./dialer-service
      dockerfile: Dockerfile
    ports:
      - '8020:8080'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - PORT=8080
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/voicelink
      - REDIS_URL=redis://redis:6379
      - TELEPHONY_PROVIDER=twilio
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - NESTJS_CALLBACK_URL=http://backend:4000
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-change-me-internal-key}
    restart: unless-stopped

  # NestJS Backend API Gateway
  backend:
    container_name: callnow-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '8010:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - PORT=4000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/voicelink
      - REDIS_URL=redis://redis:6379
      - DIALER_SERVICE_URL=http://dialer:8080
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-change-me-internal-key}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-change-me-access-secret}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-change-me-refresh-secret}
      - CORS_ORIGIN=http://localhost:8000,http://localhost:3000,http://localhost:3001
    restart: unless-stopped

  # Next.js Frontend Web App
  frontend:
    container_name: callnow-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8010
        - NEXT_PUBLIC_WS_URL=ws://localhost:8010
    ports:
      - '${FRONTEND_PORT:-8000}:3000'
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8010
      - NEXT_PUBLIC_WS_URL=ws://localhost:8010
      - NESTJS_API_URL=http://backend:4000
    restart: unless-stopped

  # pgAdmin 4 — PostgreSQL web admin interface
  pgadmin:
    container_name: callnow-pgadmin
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@callnow.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    volumes:
      - pgadmindata:/var/lib/pgadmin
    depends_on:
      - postgres

volumes:
  pgdata:
  redisdata:
  pgadmindata:
